<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Calendrier économique - USA</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: rgb(25, 25, 25);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem;
      font-family: Arial, sans-serif;
      color: #ccc;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    .calendar-wrapper {
      background-color: transparent;
      width: 800px;
      max-width: 100%;
    }
  </style>
</head>

<body>

  <div class="calendar-wrapper">
    <div id="economic-calendar-244766"></div>

    <script type="text/javascript" src="https://fxverify.com/Content/remote/remote-calendar-widget.js"></script>

    <script type="text/javascript">
      RemoteCalendar({
        Lang: "en",
        DefaultTime: "this_week",
        DefaultTheme: "plain",
        Url: "https://fxverify.com",
        SubPath: "economic-calendar",
        IsShowEmbedButton: false,
        DefaultCountries: "US",
        DefaultImpacts: "HIGH,MEDIUM",
        TimeZone: "America/New_York",
        ContainerId: "economic-calendar-244766"
      });
    </script>
  </div>

</body>

</html>
