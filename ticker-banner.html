<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      background: transparent;
      padding: 0;
    }

    .tradingview-widget-container {
      background-color: rgb(25, 25, 25);
      padding: 5px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://fr.tradingview.com/" rel="noopener nofollow" target="_blank">
          <span class="blue-text">Suivre tous les marchés sur TradingView</span>
        </a>
      </div>

      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BLACKBULL:USTEC.F", "title": "E-MINI Nasdaq 100" },
          { "proName": "BLACKBULL:US500.F", "title": "E-MINI S&P 500" },
          { "proName": "FOREXCOM:EURUSD", "title": "EURUSD Forex.com" },
          { "proName": "FOREXCOM:GBPUSD", "title": "GBPUSD Forex.com" },
          { "proName": "FOREXCOM:USDCAD", "title": "USDCAD Forex.com" },
          { "proName": "TVC:GOLD", "title": "Gold TVC" },
          { "proName": "TVC:SILVER", "title": "Silver TVC" },
          { "proName": "BITSTAMP:BTCUSD", "title": "BTCUSD Bitstamp" },
          { "proName": "BITSTAMP:ETHUSD", "title": "ETHUSD Bitstamp" }
        ],
        "colorTheme": "dark",
        "locale": "fr",
        "largeChartUrl": "",
        "isTransparent": true,
        "showSymbolLogo": true,
        "displayMode": "adaptive"
      }
      </script>
    </div>
  </div>
</body>
</html>
